name: Flutter
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format source
        run: dart format lib test
      - name: Export formatted sources for review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('lib').rglob('*.dart')) + list(Path('test').rglob('*.dart')) + [Path('pubspec.lock')]
          print('SOURCE_SNAPSHOT=' + json.dumps({str(p): p.read_text() for p in paths}))
          PY
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: simples-qr-web
          path: build/web
      - name: Build Android
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: simples-qr-android
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fontes-formatadas
          path: |
            lib/
            test/
            pubspec.lock
